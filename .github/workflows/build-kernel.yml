name: Build kernel-electro-miatoll-4.14.357

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: ARM64 defconfig (relative to arch/arm64/configs)
        type: string
        default: vendor/xiaomi/miatoll_defconfig
        required: true
      ksu_ref:
        description: KernelSU ref (latest, pinned, tag, branch, or SHA)
        type: string
        default: latest
        required: false
      nomount_ref:
        description: NoMount ref (latest, pinned, tag, branch, or SHA)
        type: string
        default: latest
        required: false

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # Neutron 06092026 requires glibc >= 2.43. Keep it isolated from the
    # runner host; pin the amd64 image, not a moving tag or Antman libc patch.
    container:
      image: ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794
    defaults:
      run:
        shell: bash
    # Polly, SCSI blk-mq, mq runtime PM and the ADIOS boot default are no
    # longer workflow inputs; scripts/ci/build-kernel.sh enables them for the
    # miatoll defconfig.
    env:
      HOST_LLVM_BIN: /usr/bin
      DEFCONFIG: ${{ inputs.defconfig || 'vendor/xiaomi/miatoll_defconfig' }}
      KSU_REF: ${{ inputs.ksu_ref || 'latest' }}
      NOMOUNT_REF: ${{ inputs.nomount_ref || 'latest' }}
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: kernel-ci
    steps:
      # Bootstrap before checkout: the minimal container may not include Git.
      - name: Install container build dependencies and native host LLVM
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            make python3 python3-venv git curl ca-certificates cpio rsync zip unzip \
            xz-utils zstd lz4 clang lld libclang-rt-dev

      - name: Check out kernel
        uses: actions/checkout@v4

      - name: Set up external KernelSU source
        run: bash scripts/kernelsu/setup.sh

      - name: Set up external NoMount source
        run: bash scripts/nomount/setup.sh

      - name: Test Neutron installer and build-script contracts (synthetic)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/testing/selftests/neutron/test_toolchain.py
          python3 tools/testing/selftests/scsi_mq_pm/test_pm.py --cc /usr/bin/clang
          python3 tools/testing/selftests/adios/test_adios.py --cc /usr/bin/clang
          python3 tools/testing/selftests/adios/test_defaults.py --cc /usr/bin/clang
          python3 tools/testing/selftests/bpf_upgrade/test_cves_2026.py --cc /usr/bin/clang
          python3 tools/testing/selftests/lz4/test_ci.py

      - name: Restore pinned Neutron toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: .toolchains/neutron-06092026
          key: neutron-linux-x86_64-${{ hashFiles('scripts/ci/neutron.lock.json') }}-v1

      - name: Install or verify the pinned Antman-catalogue release
        run: python3 scripts/ci/neutron-toolchain.py install

      - name: Record native host toolchain and container provenance
        run: |
          mkdir -p out
          cat /etc/os-release > out/host-environment.log
          getconf GNU_LIBC_VERSION >> out/host-environment.log
          clang --version >> out/host-environment.log
          ld.lld --version >> out/host-environment.log
          dpkg-query -W >> out/host-environment.log

      - name: Test LZ4 v1.11.1 block codec and kernel adaptation
        env:
          TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchains/neutron-06092026
        run: |
          mkdir -p out
          set +e
          bash scripts/ci/test-lz4.sh 2>&1 | tee out/lz4-driver.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            python3 -c 'from pathlib import Path; text="\n".join(Path("out/lz4-driver.log").read_text(errors="replace").splitlines()[-45:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"

      - name: Build with Clang and LLVM tools
        env:
          TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchains/neutron-06092026
        run: |
          mkdir -p out
          set +e
          bash scripts/ci/build-kernel.sh 2>&1 | tee out/kernel-driver.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            python3 -c 'from pathlib import Path; text="\n".join(Path("out/kernel-driver.log").read_text(errors="replace").splitlines()[-45:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f out/build.log ]; then
            ERR=$(grep -n -E 'error:|undefined reference|\*\*\*' out/build.log | tail -n 25 || tail -n 25 out/build.log)
            echo "::error::${ERR//$'
'/%0A}"
          fi

      - name: Check out pinned AnyKernel3 installer
        if: env.DEFCONFIG == 'vendor/xiaomi/miatoll_defconfig'
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: 020dfeccf9d7e962a48400fc94d3e451df92eead
          path: out/anykernel3
          persist-credentials: false

      - name: Test packaging script with synthetic payloads (not bootable)
        if: env.DEFCONFIG == 'vendor/xiaomi/miatoll_defconfig'
        run: python3 tools/testing/selftests/lz4/test_ci.py --anykernel out/anykernel3

      - name: Package flashable miatoll kernel
        if: env.DEFCONFIG == 'vendor/xiaomi/miatoll_defconfig'
        shell: bash
        run: bash scripts/ci/package-anykernel.sh 2>&1 | tee out/package.log

      - name: Publish GitHub Release
        if: env.DEFCONFIG == 'vendor/xiaomi/miatoll_defconfig'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="miatoll-4.14.357-${{ github.run_number }}"
          KSU_TAG=$(git -C KernelSU describe --tags --exact-match 2>/dev/null || git -C KernelSU rev-parse --short HEAD)
          KSU_VER=$(sed -n 's/.*-DKSU_VERSION=\([0-9]\+\).*/\1/p' KernelSU/kernel/Makefile | head -n1)
          NOMOUNT_TAG=$(git -C NoMount describe --tags --exact-match 2>/dev/null || git -C NoMount rev-parse --short HEAD)
          KSU_LABEL="${KSU_TAG}${KSU_VER:+_${KSU_VER}}"

          for old in $(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("miatoll-4.14.357-")) | .tagName'); do
            gh release delete "$old" --yes --cleanup-tag || true
          done

          gh release create "$TAG" \
            out/flashable/kernel-electro-miatoll-4.14.357.zip \
            out/flashable/kernel-electro-miatoll-4.14.357.zip.sha256 \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "KernelSU: ${KSU_LABEL}
            NoMount: ${NOMOUNT_TAG}"

      - name: Upload flashable AnyKernel3 ZIP
        if: env.DEFCONFIG == 'vendor/xiaomi/miatoll_defconfig'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-electro-miatoll-4.14.357
          path: |
            out/flashable/kernel-electro-miatoll-4.14.357.zip
            out/flashable/kernel-electro-miatoll-4.14.357.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload kernel images and modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-electro-miatoll-4.14.357-images
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
            out/**/*.ko
            out/System.map
            out/Module.symvers
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs, resolved config, and toolchain provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-electro-miatoll-4.14.357-details
          include-hidden-files: true
          path: |
            out/*.log
            out/.config
            out/build-info.txt
            out/polly-probe.ll
            scripts/ci/neutron.lock.json
            out/package-info.txt
            out/lz4-tests/*.log
          if-no-files-found: warn
          retention-days: 14
